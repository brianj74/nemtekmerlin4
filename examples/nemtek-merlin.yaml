# Complete reference config for a classic ESP32.
# Receive only: DAT is GPIO21 RX. Do not add tx_pin.
#
# Already have this device in the ESPHome dashboard? Keep your existing
# esphome:, esp32:, wifi:, api:, and ota: blocks. Copy the
# external_components:, uart:, and nemtek: blocks from here.
# Sensor keys sit directly under nemtek:, alongside capture: and mark:.
#
# secrets.yaml next to this file:
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_encryption_key: "..."   # 32-byte base64 key from the ESPHome wizard
#   ota_password: "..."

esphome:
  name: nemtek-merlin
  friendly_name: Nemtek Merlin

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/brianj74/nemtekmerlin4
      ref: cursor/nemtek-capture-d374
    components: [nemtek]

uart:
  id: nemtek_uart
  rx_pin:
    number: GPIO21
    inverted: true
  baud_rate: 2400
  data_bits: 8
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 256
  # One byte makes each byte visible to the capture timestamps.
  # The component also sets these in setup.
  rx_full_threshold: 1
  rx_timeout: 1

nemtek:
  uart_id: nemtek_uart
  # Identical idle bursts are counted instead of logged one by one.
  # Set false only for a short capture if you need every repeat in full.
  capture_coalesce: true
  capture:
    name: "Nemtek Capture"
    restore_mode: ALWAYS_OFF
    entity_category: config
  mark:
    name: "Nemtek Capture Mark"
    mode: TEXT
    entity_category: config
  communications:
    name: "Nemtek Communications"
  fence_off:
    name: "Nemtek Fence Off"
  fence_low_power:
    name: "Nemtek Low Power"
  fence_volts_low:
    name: "Nemtek Voltage Low"
  fence_alarm_volts:
    name: "Nemtek Alarm Voltage"
  alarm_active:
    name: "Nemtek Alarm"
  hv_good:
    name: "Nemtek HV Good"
  hv_check:
    name: "Nemtek HV Check"
  hv_bad:
    name: "Nemtek HV Bad"
  buzzer_active:
    name: "Nemtek Buzzer"
